version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: fn_pedidos_postgres
    environment:
      POSTGRES_DB: fn_pedidos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
