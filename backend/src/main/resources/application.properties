spring.application.name=fn-pedidos-backend
server.port=8080

# Conexión PostgreSQL Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/fn_pedidos_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.separator=@@


# Configuración Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Inicialización SQL (procedimientos almacenados en schema.sql)
# 'always' ejecuta schema.sql en cada arranque; el SP usa CREATE OR REPLACE
# por lo que es idempotente y seguro de reejecutar.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
